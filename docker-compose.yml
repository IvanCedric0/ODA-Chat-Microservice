services:
  chat-db:
    image: postgres:16-alpine
    container_name: chat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chat_user
      POSTGRES_PASSWORD: chat_db
    ports: 
      - "5433:5432" # Uses 5433 on your host so it won't clash with your local Postgres on 5432!
    volumes:
      - chat_pgdata:/var/lib/postgresql/data

volumes:
  chat_pgdata: